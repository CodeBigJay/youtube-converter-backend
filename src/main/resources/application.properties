# Server port (Railway/Render inject $PORT at runtime; falls back to 8080 locally)
server.port=${PORT:8080}

# File storage directory (relative to project root). You can change to absolute path.
app.storage.dir=media-storage

# Maximum file size configuration (example)
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB
